<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>观棋 · 个人工作站</title>
    <style>
        body { 
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; 
            background: #f5f5f0; 
            padding: 60px 20px; 
            color: #333; 
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%;
            max-width: 900px; 
        }
        h1 { 
            color: #2d6b58; 
            font-size: 28px; 
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p.subtitle { 
            font-size: 14px; 
            color: #888; 
            margin-bottom: 40px; 
            letter-spacing: 1px;
        }
        
        /* 网格布局 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* 工具卡片 */
        .tool-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0,0,0,0.02);
            display: block;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .tool-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #2d6b58;
        }
        .tool-card p {
            margin: 0;
            font-size: 13px;
            color: #777;
            line-height: 1.6;
        }
        
        /* 状态标签 */
        .status {
            display: inline-block;
            margin-top: 15px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(45, 107, 88, 0.08);
            color: #2d6b58;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QUICK TOOLS</h1>
        <p class="subtitle">观棋 · 专属个人效率工作台</p>

        <div class="tools-grid">
            <!-- 工具 1：图片数据生成器 -->
            <a href="gmj-json-maker.html" class="tool-card">
                <h3>图片数据生成器</h3>
                <p>为观梦居画廊快速生成符合格式的 JSON 数据代码，自动分配文件夹路径。</p>
                <span class="status">已上线</span>
            </a>

            <!-- 占位工具 2：未来扩展 -->
            <a href="#" class="tool-card" style="opacity: 0.6; cursor: not-allowed;">
                <h3>更多工具开发中</h3>
                <p>拼豆管家、灵感记录站、灵感 API 测试... 敬请期待。</p>
                <span class="status" style="background:#eee; color:#999;">企划中</span>
            </a>
        </div>
    </div>
</body>
</html>
